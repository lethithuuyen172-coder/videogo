app = "ai-shoppable-video-factory-api"
primary_region = "sin"

[build]
  dockerfile = "backend/Dockerfile.fly"

[env]
  ENVIRONMENT = "prod"
  STORAGE_BACKEND = "r2"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[http_service.checks]]
  interval = "10s"
  timeout = "2s"
  grace_period = "20s"
  method = "GET"
  path = "/health"
