[project]
name = "ai-shoppable-video-factory"
version = "2.0.0"
description = "AI带货视频工厂 V2.0 backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "email-validator>=2.2.0",
  "asyncpg>=0.29.0",
  "redis>=5.0.0",
  "rq>=1.16.0",
  "apscheduler>=3.11.0",
  "httpx>=0.27.0",
  "openai>=1.0",
  "python-multipart>=0.0.9",
  "structlog>=24.1.0",
  "PyJWT>=2.8.0",
  "passlib[bcrypt]>=1.7.4",
  "bcrypt>=4.1.0",
  "pillow>=10.3.0",
  "boto3>=1.34.0",
  "stripe>=9.0.0",
  "opentelemetry-sdk>=1.26.0",
  "opentelemetry-instrumentation-fastapi>=0.47b0",
  "prometheus-client>=0.20.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.5.0",
  "mypy>=1.10.0",
  "bandit>=1.7.9",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["migrations*", "tests*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
