name: cd

on:
  workflow_dispatch:
    inputs:
      environment:
        required: true
        default: dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy API
        if: ${{ env.FLY_API_TOKEN != '' }}
        run: flyctl deploy --config fly.toml --strategy canary
      - name: Missing Fly token
        if: ${{ env.FLY_API_TOKEN == '' }}
        run: echo "FLY_API_TOKEN is not configured; deployment skipped."
